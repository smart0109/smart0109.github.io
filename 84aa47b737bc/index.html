function buildFlow(ind){
  var v=$("flowview");
  var h='<div class="cathead"><div class="logos"><img src="'+ind.hubLogos[0]+'"></div><h2>'+ind.title+'</h2><p>'+ind.subtitle+'</p></div>';
  h+='<div class="hirewrap"><div class="htag">'+(ind.wrapLabel||"HIRING FLOW")+'</div><div class="flowrow">';
  ind.flow.forEach(function(st,si){
    if(si>0)h+='<div class="farr">&rarr;</div>';
    h+='<div class="fstep"><div class="sh">'+st.step+'</div><div class="fbody">';
    st.items.forEach(function(it){
      if(it.or){h+='<div class="forr">&#8212; OR &#8212;</div>';return;}
      var man=it.human||it.manual;
      h+='<div class="fcard'+(it.human?" human":"")+'"><div class="n">'+it.n+'</div><div class="d">'+it.d+'</div><span class="stat '+(man?"man":"auto")+'">'+(man?"&#9679; Manual":"&#10004; Automated")+'</span></div>';
    });
    h+='</div></div>';
  });
  h+='</div>';
  h+='<div class="txtband"><span style="font-size:18px">&#128172;</span><div><div class="nm">'+ind.texting.n+'</div><div class="ds">'+ind.texting.d+'</div></div><span class="stat man" style="margin-left:auto">&#9679; Manual</span></div>';
  h+='</div>';
  h+='<div class="catfoot" style="margin-top:14px"><span class="c" style="border-color:#37d39b;color:#7fe9c0">&#10004; Automated by Cadient</span><span class="c" style="border-color:#f4922e;color:#ffc081">&#9679; Manual &middot; texting &amp; human interview</span></div>';
  v.innerHTML=h;
}
function show(key){
  current=key;const ind=DATA[key];$("drawer").classList.remove("open");var _sf=$("subflow");if(_sf)_sf.classList.remove("open");
  $("eyebrow").textContent=(ind.eyebrow||"").replace("Vorro BridgeGate","Vorro").replace("BridgeGate","Vorro");
  $("ttl").textContent=(ind.flow||ind.catalog||ind.noVorro)?ind.name:(ind.hubMain?(ind.name+" Â· "+ind.hubMain+" "+ind.hubSecond):(ind.name+" Â· Vorro"));
  $("legIn").style.background=ind.accent;
  [...document.querySelectorAll(".tab")].forEach(t=>{const on=t.dataset.k===key;t.classList.toggle("active",on);t.style.background=on?("linear-gradient(180deg,"+ind.accent+"66,"+ind.accent+"22)"):"transparent";});
  $("prompt").value=ind.prompt;setBg(key);if(ind.flow){$("diagram").style.display="none";$("catview").classList.remove("show");$("flowview").classList.add("show");buildFlow(ind);}else if(ind.catalog){$("diagram").style.display="none";$("flowview").classList.remove("show");$("catview").classList.add("show");buildCatalog(ind);}else{$("diagram").style.display="";$("catview").classList.remove("show");$("flowview").classList.remove("show");buildDiagram(key);}
}
const tabsEl=$("tabs");
ORDER.forEach(k=>{const b=document.createElement("button");b.className="tab";b.dataset.k=k;b.textContent=DATA[k].name;b.onclick=()=>show(k);tabsEl.appendChild(b);});
$("fab").onclick=()=>$("panel").classList.toggle("open");
$("gen").onclick=async()=>{
  const btn=$("gen"),st=$("status"),model=$("model").value,aspect=$("aspect").value,prompt=$("prompt").value.trim();
  if(!prompt){st.className="status err";st.textContent="Enter a prompt.";return;}
  btn.disabled=true;st.className="status";st.textContent="Generating with fal...";
  try{
    const body=model.includes("imagen")?{prompt,aspect_ratio:"16:9",num_images:1}:{prompt,image_size:aspect,num_images:1};
    const r=await fetch("https://fal.run/"+model,{method:"POST",headers:{"Authorization":"Key "+FAL_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
    const data=await r.json();if(!r.ok)throw new Error(data.detail||("HTTP "+r.status));
    const url=(data.images&&data.images[0]&&data.images[0].url)||"";if(!url)throw new Error("No image returned.");
    const s=saved();s[current]=url;setSaved(s);
    const back=frontIsA?$("bgB"):$("bgA"),front=frontIsA?$("bgA"):$("bgB");
    back.style.background='url("'+url+'") center/cover';back.classList.add("show");front.classList.remove("show");frontIsA=!frontIsA;
    st.className="status ok";st.textContent="Done. Backdrop updated and saved.";
  }catch(e){st.className="status err";st.textContent=/balance|locked/i.test(e.message)?"fal balance exhausted - top up to generate.":("Error: "+e.message);}
  finally{btn.disabled=false;}
};
$("reset").onclick=()=>{localStorage.removeItem("vorroPipeBg");show(current);$("status").textContent="Reset to fal default backdrops.";};
var _h=decodeURIComponent(location.hash.slice(1));show((_h&&DATA[_h])?_h:ORDER[0]);
window.addEventListener("hashchange",function(){var h=decodeURIComponent(location.hash.slice(1));if(h&&DATA[h])show(h);});
</script></body></html>
